name: landing

on:
  push:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/landing/.node-version
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: landing-evidence-${{ github.sha }}
          path: |
            apps/landing/playwright-report/
            apps/landing/test-results/
          retention-days: 14
          if-no-files-found: warn
