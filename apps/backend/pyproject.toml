[project]
name = "tappy-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.165",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tappy"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "N", "S", "ASYNC", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/support.py" = ["S603"]
"tests/test_startup.py" = ["S310"]
"tests/test_persistence.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["tappy", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
