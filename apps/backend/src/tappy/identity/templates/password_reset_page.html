<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset your Tappy password</title>
    <style nonce="{{ nonce }}">
        body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 3rem auto; padding: 0 1rem; color: #1f1b1a; }
        label { display: block; margin-top: 1rem; font-weight: 600; }
        input { width: 100%; padding: .6rem; margin-top: .3rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; padding: .7rem 1rem; width: 100%; }
        .notice { padding: .8rem; border-radius: .4rem; background: #f3efe9; }
        .error { background: #fbe9e7; }
    </style>
</head>
<body>
<main>
    <h1>Reset your Tappy password</h1>
    {% if changed %}
        <p class="notice" role="status">Your password was changed. Every open session was closed; sign in again with your new password.</p>
        <script nonce="{{ nonce }}">sessionStorage.removeItem("tappy-reset-token");</script>
    {% else %}
        {% if error %}
            <p class="notice error" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="/password-reset" autocomplete="off">
            <input type="hidden" id="token" name="token" value="">
            <label for="new_password">New password</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
            <label for="confirm_password">Repeat the new password</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
            <button type="submit">Change password</button>
        </form>
        <script nonce="{{ nonce }}">
            const token = new URLSearchParams(window.location.hash.slice(1)).get("token");
            if (token) {
                sessionStorage.setItem("tappy-reset-token", token);
                history.replaceState(null, "", window.location.pathname);
            }
            document.getElementById("token").value = sessionStorage.getItem("tappy-reset-token") || "";
        </script>
    {% endif %}
</main>
</body>
</html>
