name: tappy

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tappy
      POSTGRES_USER: tappy
      POSTGRES_PASSWORD: ${TAPPY_POSTGRES_PASSWORD:?set TAPPY_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TAPPY_POSTGRES_PORT:-5482}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tappy -d tappy"]
      interval: 2s
      timeout: 3s
      retries: 30

  test-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: tappy_test
      POSTGRES_PASSWORD: ${TAPPY_TEST_POSTGRES_PASSWORD:?set TAPPY_TEST_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TAPPY_TEST_POSTGRES_PORT:-5483}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tappy_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
